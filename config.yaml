# Surveillance detector settings. Edit and re-run; no code changes needed.

camera:
  source: 0            # 0 = built-in webcam, or a path to a video / image / folder of images
  width: 1280
  height: 720
  mirror: true         # flip webcam horizontally (feels natural when facing the camera)

models:
  pose: models/yolo11n-pose.pt      # people + 17 body keypoints (pretrained on COCO)
  objects: models/yolo11n.pt        # bags, laptops, phones... for theft detection
  tracker: bytetrack.yaml
  imgsz: 480                        # lower = faster, higher = better for small/far people
  conf: 0.4
  object_conf: 0.35
  object_every_n_frames: 3          # object model is slower, run it less often

zones:
  file: zones.json                  # created when you draw zones in the app (Z / L keys)
  anchor: center                    # "center" (body centre, good for webcam) or "feet" (good for CCTV/rover)

loitering:
  enabled: true
  seconds: 20                       # time in view (or inside a loiter zone, if you drew one)

access:
  enabled: true

fight:
  enabled: true
  method: model                     # model = trained GRU (models/fight_gru.pt), rules = hand-tuned thresholds below
  model: models/fight_gru.pt        # made by training/train_fight.py; falls back to rules if missing
  model_threshold: null             # null = use the threshold chosen during training (in fight_gru.json)
  model_consecutive: null           # null = the number chosen in training (judgements in a row above the threshold)
  window_seconds: 0.6               # motion is averaged over this window
  motion_threshold: 5.0             # arm speed in body-widths/second; press V in the app to see live values
  proximity: 3.5                    # people closer than this many body-widths count as "close"
  window_frames: 12                 # temporal smoothing: look at the last N frames...
  min_positive_frames: 5            # ...and alert if at least this many looked like fighting

theft:
  enabled: true
  classes: [backpack, handbag, suitcase, laptop, cell phone, book, bottle]
  guard_seconds: 3                  # an object still for this long becomes "guarded"
  move_fraction: 1.0                # guarded object moved more than this x its own size = taken
  vanish_seconds: 1.5               # guarded object disappeared for this long right after a hand touched it = taken
  hand_memory_seconds: 1.5          # how recently a hand must have touched it

alerts:
  dir: alerts                       # snapshots, clips and alerts.jsonl go here
  cooldown_seconds: 10              # don't repeat the same alert more often than this
  type_cooldown_seconds: 10         # one alert per kind per 10 s: 3 people fighting = 1 alert, not 6 (the screen still marks everyone)
  clip_seconds: 4                   # seconds of footage before the alert saved as a clip
  sound: true

rover:
  url: null                         # Pi agent address, e.g. http://192.168.137.50:8000 (null = no rover, use camera.source)
  token: change-me                  # must match --token given to rover_agent.py on the Pi
  start_mode: patrol                # patrol = wander by itself (default) | guard = parked | manual = you drive
  look_before_turn_s: 1.5           # stopped by something in front: look this long; people in view = stay and record
  speed: 150                        # motor PWM 0-255 used for patrol and driving
  leg_ms: 1200                      # one forward step of the patrol
  legs_per_scan: 3                  # forward steps between 360-degree looks
  turn_90_ms: 700                   # spin time for ~90 degrees; calibrate on your floor (SETUP_GUIDE F.4.4)
  scan_hold_s: 4                    # seconds to look in each of the 4 directions
  lost_s: 5                         # stop watching this long after the last person disappeared
  investigate_max_s: 60             # watch people for at most this long (no alert), then move on
  move_on_s: 20                     # ...and ignore people this long so the rover really leaves (alerts still stop it)
  alert_hold_s: 20                  # after an alert, stay still and keep recording this long
  avoid_min_cm: 40                  # both sides closer than this: back up and turn around

backend:
  url: null                         # e.g. http://localhost:8080 once the backend is running
  device_token: change-me-too       # must match backend.device_token used by the backend
  live_view_port: 8081              # annotated live view for the dashboard / phone
